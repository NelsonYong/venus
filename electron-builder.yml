appId: com.venus.desktop
productName: Venus
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

files:
  - "electron/dist/**/*"
  - "!node_modules"

extraResources:
  # Standalone Next.js build output
  - from: ".next/standalone"
    to: "standalone"
    filter:
      - "**/*"
  # Static assets (not included in standalone by default)
  - from: ".next/static"
    to: "standalone/.next/static"
    filter:
      - "**/*"
  # Public folder
  - from: "public"
    to: "standalone/public"
    filter:
      - "**/*"
  # Prisma engine
  - from: "lib/generated/prisma"
    to: "prisma-engine"
    filter:
      - "libquery_engine-*.node"
      - "schema.prisma"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
